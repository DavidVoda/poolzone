services:
  postgres:
    image: postgres:16
    container_name: poolzone-postgres
    environment:
      POSTGRES_USER: poolzone
      POSTGRES_PASSWORD: poolzone
      POSTGRES_DB: poolzone
    ports:
      - "5432:5432"
    volumes:
      - poolzone-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poolzone -d poolzone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  poolzone-pgdata:
